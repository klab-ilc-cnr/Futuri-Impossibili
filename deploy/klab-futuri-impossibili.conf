# Futuri (im)possibili - proxy per il dominio pubblico
# Da includere nel VirtualHost HTTPS (mod_proxy/mod_proxy_http attivi).
# Il server host espone la porta ${futuri_port} (DNAT) verso la VM.

### Host del server raggiungibile da klab + porta mappata
Define futuri_host IP-DEL-SERVER-RAGGIUNGIBILE-DA-PROXY
Define futuri_port PORTA-NAT-HOST

### URL pubblica
Define futuri_deploy futuri-impossibili

ProxyPreserveHost On

RewriteEngine On
RewriteRule ^/${futuri_deploy}$ /${futuri_deploy}/ [R,L]

### Asset hashed (JS/CSS/fonts): vinext li serve solo alla root -> riscrittura del prefisso
### (i file sono spostati in dist/client/_next dal deploy/post-build.sh)
ProxyPass        /${futuri_deploy}/_next/static http://${futuri_host}:${futuri_port}/_next/static
ProxyPassReverse /${futuri_deploy}/_next/static http://${futuri_host}:${futuri_port}/_next/static

### Tutto il resto (pagina, API /api/lexo, file pubblici) in passthrough
ProxyPass        /${futuri_deploy}/ http://${futuri_host}:${futuri_port}/${futuri_deploy}/
ProxyPassReverse /${futuri_deploy}/ http://${futuri_host}:${futuri_port}/${futuri_deploy}/
