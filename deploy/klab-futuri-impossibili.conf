# Futuri (im)possibili - proxy per klab.ilc.cnr.it
# Da includere nel VirtualHost HTTPS di klab.ilc.cnr.it (mod_proxy/mod_proxy_http attivi).
# Il server host espone la porta 14301 (DNAT) verso la VM 10.10.0.14:3001.

### Host del server raggiungibile da klab + porta mappata
Define futuri_host IP-DEL-SERVER-RAGGIUNGIBILE-DA-KLAB
Define futuri_port 14301

### URL pubblica
Define futuri_deploy futuri-impossibili

ProxyPreserveHost On

RewriteEngine On
RewriteRule ^/${futuri_deploy}$ /${futuri_deploy}/ [R,L]

ProxyPass        /${futuri_deploy}/ http://${futuri_host}:${futuri_port}/${futuri_deploy}/
ProxyPassReverse /${futuri_deploy}/ http://${futuri_host}:${futuri_port}/${futuri_deploy}/
